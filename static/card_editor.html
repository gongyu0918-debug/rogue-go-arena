  <title>rogue-go-arena Card Workshop</title>
  <link rel="icon" type="image/png" href="assets/rogue-go-arena-favicon.png?v=20260430a">
  <style>
    :root {
      color-scheme: dark;
      --bg: #120d09;
      --panel: rgba(30, 22, 15, 0.94);
      --panel-2: rgba(44, 32, 22, 0.92);
      --line: rgba(226, 171, 83, 0.2);
      --line-strong: rgba(237, 191, 105, 0.5);
      --text: #f6ead7;
      --muted: #b9a891;
      --faint: #8d7d68;
      --gold: #f0c567;
      --green: #7fd89b;
      --red: #f08a7a;
      --radius: 12px;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(219, 151, 57, 0.14), transparent 26rem),
        radial-gradient(circle at 96% 0%, rgba(90, 121, 146, 0.12), transparent 28rem),
        linear-gradient(135deg, #100a07 0%, #22150d 50%, #0f0b09 100%);
      background-attachment: fixed;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: linear-gradient(180deg, rgba(81, 55, 29, 0.9), rgba(32, 23, 16, 0.96));
      cursor: pointer;
    }
    button:hover { border-color: rgba(240, 197, 103, 0.9); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary {
      border-color: transparent;
      background: linear-gradient(180deg, #f0c567, #b8862f);
      color: #1d1308;
      font-weight: 800;
    }
    button.ghost { background: transparent; border-color: var(--line); }
    button.danger { border-color: rgba(240, 138, 122, 0.7); color: #ffd4cc; }
    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(226, 171, 83, 0.22);
      border-radius: 8px;
      background: rgba(8, 10, 12, 0.7);
      outline: none;
    }
    input, select { min-height: 38px; padding: 0 10px; }
    textarea { min-height: 84px; padding: 9px 10px; line-height: 1.5; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: rgba(240, 197, 103, 0.8); }
    input[type="range"] { padding: 0; min-height: 28px; accent-color: var(--gold); background: transparent; border: 0; }

    .shell { width: min(1240px, 100%); margin: 0 auto; padding: 20px 16px 120px; display: grid; gap: 16px; }

    header.top { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; }
    .brand h1 { margin: 0; font-size: clamp(24px, 3.4vw, 34px); color: var(--gold); line-height: 1.1; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .top-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 12px; border-radius: 999px; font-size: 13px;
      border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); color: var(--muted);
    }
    .status-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .status-chip.dirty::before { background: var(--gold); }
    .status-chip.pending::before { background: #8fb0df; }
    .lang-select { width: auto; min-width: 128px; }

    .menu { position: relative; }
    .menu-panel {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
      display: grid; gap: 6px; min-width: 220px; padding: 8px;
      border: 1px solid var(--line-strong); border-radius: var(--radius);
      background: rgba(22, 16, 11, 0.98); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    }
    .menu-panel button { text-align: left; }

    .notice {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 11px 14px; border-radius: var(--radius);
      border: 1px solid rgba(143, 176, 223, 0.35); background: rgba(143, 176, 223, 0.1);
      color: #dbe7f8; font-size: 14px; line-height: 1.5;
    }
    .errorbox {
      padding: 11px 14px; border-radius: var(--radius);
      border: 1px solid rgba(240, 138, 122, 0.4); background: rgba(240, 138, 122, 0.12);
      color: #ffd7d0; font-size: 13px; line-height: 1.55;
    }

    nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    nav.tabs button {
      border: 0; border-bottom: 3px solid transparent; border-radius: 0;
      background: transparent; color: var(--muted); padding: 0 14px; min-height: 44px; font-weight: 600;
    }
    nav.tabs button .count { margin-left: 6px; color: var(--faint); font-weight: 400; }
    nav.tabs button.active { color: var(--gold); border-bottom-color: var(--gold); }
    nav.tabs .spacer { flex: 1; }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .toolbar .search { flex: 1 1 260px; position: relative; }
    .toolbar .search input { padding-left: 34px; min-height: 42px; }
    .toolbar .search::before { content: "⌕"; position: absolute; left: 11px; top: 8px; color: var(--faint); font-size: 18px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      min-height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px;
      border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); color: var(--muted);
    }
    .chip.active { border-color: var(--gold); color: var(--gold); background: rgba(240, 197, 103, 0.1); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .section-intro { color: var(--muted); font-size: 14px; margin: 0; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
    .card-row {
      display: grid; gap: 12px; align-content: start;
      padding: 14px; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--panel);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    }
    .card-row.off { opacity: 0.72; }
    .card-row.open { grid-column: 1 / -1; border-color: var(--line-strong); background: var(--panel-2); }
    .card-head { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
    .card-icon {
      width: 48px; height: 48px; display: grid; place-items: center; font-size: 24px;
      border-radius: 10px; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3);
    }
    .card-title { min-width: 0; }
    .card-title strong { display: block; font-size: 16px; overflow-wrap: anywhere; }
    .card-title .mono { color: var(--faint); font: 12px Consolas, "Cascadia Mono", monospace; }
    .card-desc { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-row.open .card-desc { display: none; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      padding: 2px 8px; border-radius: 999px; font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.05); color: var(--muted);
    }
    .badge.tier { color: var(--gold); border-color: rgba(240, 197, 103, 0.4); }
    .badge.edited { color: #1d1308; background: var(--gold); border-color: transparent; }
    .badge.off { color: #ffd4cc; border-color: rgba(240, 138, 122, 0.5); }
    .badge.often { color: var(--green); border-color: rgba(127, 216, 155, 0.45); }

    .editor { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
    .editor h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { display: grid; gap: 5px; }
    .field.wide { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 13px; }
    .hint { color: var(--faint); font-size: 12px; }
    .switches { display: grid; gap: 4px; }
    .switch {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      min-height: 40px; padding: 0 2px; font-size: 14px; cursor: pointer;
    }
    .switch input { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 42px; height: 24px; min-height: 0; padding: 0;
      border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.4); position: relative; cursor: pointer; }
    .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform 140ms ease; }
    .switch input:checked { background: rgba(240, 197, 103, 0.35); border-color: var(--gold); }
    .switch input:checked::after { transform: translateX(18px); background: var(--gold); }
    .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .segmented button { border: 0; border-radius: 0; min-height: 34px; background: transparent; color: var(--muted); padding: 0 12px; }
    .segmented button + button { border-left: 1px solid var(--line); }
    .segmented button.active { background: rgba(240, 197, 103, 0.18); color: var(--gold); font-weight: 700; }
    .freq { display: grid; gap: 6px; margin: 6px 0 4px; }
    .card-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

    .tune-group { display: grid; gap: 8px; }
    .tune-group > h2 { margin: 10px 0 0; font-size: 15px; color: var(--gold); display: flex; gap: 8px; align-items: center; }
    .tune-list { display: grid; gap: 8px; }
    .tune-row {
      display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 14px; align-items: center;
      padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel);
    }
    .tune-row.edited { border-color: rgba(240, 197, 103, 0.5); }
    .tune-label strong { display: block; font-size: 15px; }
    .tune-label .mono { color: var(--faint); font: 12px Consolas, "Cascadia Mono", monospace; overflow-wrap: anywhere; }
    .tune-control { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; align-items: center; }
    .tune-control input[type="number"] { text-align: right; }
    .tune-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--faint); font-size: 12px; grid-column: 1 / -1; }
    .tune-meta .pct { color: var(--gold); font-weight: 700; }
    details.advanced { grid-column: 1 / -1; }
    details.advanced summary { cursor: pointer; color: var(--faint); font-size: 12px; }
    details.advanced .fields { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 8px; }

    .json-panel { display: grid; gap: 10px; }
    .json-panel textarea { min-height: 60vh; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; white-space: pre; overflow: auto; }
    .empty { padding: 36px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

    .savebar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: rgba(18, 12, 8, 0.96); border-top: 1px solid var(--line-strong);
      box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.45);
    }
    .savebar-inner { width: min(1240px, 100%); margin: 0 auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .savebar-text { display: grid; gap: 2px; }
    .savebar-text strong { font-size: 15px; }
    .savebar-text span { color: var(--muted); font-size: 13px; }
    .savebar-actions { display: flex; gap: 8px; }

    .toast {
      position: fixed; right: 16px; bottom: 96px; z-index: 40;
      max-width: min(440px, calc(100vw - 32px)); padding: 12px 14px;
      border: 1px solid var(--line-strong); border-radius: var(--radius);
      background: rgba(18, 12, 8, 0.97); box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5);
      opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 820px) {
      .editor { grid-template-columns: 1fr; }
      .tune-row { grid-template-columns: 1fr; }
      details.advanced .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .fields { grid-template-columns: 1fr; }
      .savebar-actions { width: 100%; }
      .savebar-actions button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .toast, .switch input::after { transition: none; }
    }
  </style>
</head>

            <button type="button" id="exportBtn"></button>

    <section id="content" aria-live="polite"></section>
  </main>

    const state = {
      lang: detectLang([readStorage("card_editor_lang"), readStorage("rogue_go_arena_lang"), ...(navigator.languages || []), navigator.language]),
      tab: "rogue",
      query: "",

    const $ = id => document.getElementById(id);
    const els = {
      pageTitle: $("pageTitle"), pageSubtitle: $("pageSubtitle"), statusChip: $("statusChip"),
      langSelect: $("langSelect"), langLabel: $("langLabel"), moreBtn: $("moreBtn"), morePanel: $("morePanel"),
      reloadBtn: $("reloadBtn"), exportBtn: $("exportBtn"), resetBtn: $("resetBtn"),

      saveState: $("saveState"), saveNote: $("saveNote"), discardBtn: $("discardBtn"), saveBtn: $("saveBtn"), toast: $("toast")
    };

    function readStorage(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function writeStorage(key, value) { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } }
    function t(key, vars = {}) {
      const text = dict[state.lang]?.[key] || dict.en[key] || dict.zh[key] || key;
      return text.replace(/\{(\w+)\}/g, (_, name) => vars[name] ?? "");
    }
    // Same rules as the game (static/js/i18n.js): first recognized language wins, else English.
    function recognizeLang(value) {
      const raw = String(value || "").trim().toLowerCase().replace(/_/g, "-");
      if (!raw) return null;
      if (raw.startsWith("zh-tw") || raw.startsWith("zh-hk") || raw.startsWith("zh-mo") || raw.startsWith("zh-hant") || raw === "zht") return "zht";
      if (raw === "zh" || raw.startsWith("zh-")) return "zh";
      if (raw.startsWith("en")) return "en";
      if (raw.startsWith("ja")) return "ja";
      if (raw.startsWith("ko") || raw.startsWith("kr")) return "ko";
      if (raw.startsWith("fr")) return "fr";
      if (raw.startsWith("de")) return "de";
      return null;
    }
    function detectLang(candidates) {
      for (const candidate of candidates) {
        const lang = recognizeLang(candidate);
        if (lang) return lang;
      }
      return "en";
    }
    function locale() { return localeMap[state.lang] || "zh-CN"; }
    // Card meta values (tier/category/complexity) are stored in Chinese; show them in the UI language.
    async function loadMetaLabels(lang) {
      if (metaLabels[lang]) return;
      try {
        const response = await fetch(`/static/locales/${LOCALE_FILES[lang]}`, { cache: "no-cache" });
        metaLabels[lang] = response.ok ? (await response.json()).cardMeta || {} : {};
      } catch { metaLabels[lang] = {}; }
    }
    function metaLabel(value) { return metaLabels[state.lang]?.[value] || value; }
    function effectiveMeta(mode, id) {
      return { ...(state.config.meta?.[`${mode}_defaults`] || {}), ...(state.config.meta?.[mode]?.[id] || {}) };
    }
    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
    function textOf(value) {
      if (typeof value === "string") return value;
      if (!value || typeof value !== "object") return "";
      return value[locale()] || value["zh-CN"] || value["en-US"] || Object.values(value).find(v => typeof v === "string") || "";
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[ch]);
    }
    function numberValue(value) { const n = Number(value); return Number.isFinite(n) ? escapeHtml(n) : ""; }
    function getAt(root, path) { return path.reduce((value, key) => value?.[key], root); }
    function formatNumber(value, step) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "";
      const decimals = Number(step) < 1 ? Math.min(4, String(step).split(".")[1]?.length || 2) : 0;
      return decimals ? n.toFixed(decimals).replace(/\.?0+$/, "") : String(Math.round(n));
    }
    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 2600);
    }

    // ---- config helpers -------------------------------------------------
    function offers() {
      if (!state.config.offers) state.config.offers = { rogue_disabled: [], rogue_weights: {} };
      state.config.offers.rogue_disabled ||= [];
      state.config.offers.rogue_weights ||= {};
      return state.config.offers;
    }
    function isOffered(id) { return !(state.config.offers?.rogue_disabled || []).includes(id); }
    function setOffered(id, on) {
      const list = offers().rogue_disabled;
      const idx = list.indexOf(id);
      if (on && idx >= 0) list.splice(idx, 1);
      if (!on && idx < 0) list.push(id);
    }
    function weightOf(id) { return Number(state.config.offers?.rogue_weights?.[id] ?? 1); }
    function freqKey(id) {
      const w = weightOf(id);
      return Object.keys(FREQ).find(key => FREQ[key] === w) || "custom";
    }
    function setWeight(id, weight) {
      const weights = offers().rogue_weights;
      if (weight === 1) delete weights[id]; else weights[id] = weight;
    }
    function poolHas(pool, id) { return (state.config.pools?.[pool] || []).includes(id); }
    function setPool(pool, id, on) {
      const list = state.config.pools[pool] || (state.config.pools[pool] = []);
      const idx = list.indexOf(id);
      if (on && idx < 0) list.push(id);
      if (!on && idx >= 0) list.splice(idx, 1);
    }
    function cardSnapshot(root, mode, id) {
      if (!root) return null;
      const pools = Object.fromEntries(Object.entries(root.pools || {}).map(([k, v]) => [k, (v || []).includes(id)]));
      return {
        card: root.cards?.[mode]?.[id],
        meta: root.meta?.[mode]?.[id],
        pools,
        category: root.challenge?.categories?.[id],
        disabled: (root.offers?.rogue_disabled || []).includes(id),
        weight: root.offers?.rogue_weights?.[id] ?? 1
      };
    }
    function cardEdited(mode, id) { return !same(cardSnapshot(state.config, mode, id), cardSnapshot(state.base, mode, id)); }
    function tuneEdited(key) { return !same(state.config.tuning?.[key], state.base?.tuning?.[key]); }
    function unsavedCount() {
      if (!state.config || !state.saved) return 0;
      let count = 0;
      for (const mode of ["rogue", "ultimate"]) {
        for (const id of Object.keys(state.config.cards?.[mode] || {})) {
          if (!same(cardSnapshot(state.config, mode, id), cardSnapshot(state.saved, mode, id))) count += 1;
        }
      }
      for (const key of Object.keys(state.config.tuning || {})) {
        if (!same(state.config.tuning[key], state.saved.tuning?.[key])) count += 1;
      }
      const rest = cfg => { const copy = clone(cfg); delete copy.cards; delete copy.meta; delete copy.pools; delete copy.tuning; delete copy.offers; delete copy.challenge; delete copy.updated_at; return copy; };
      if (!same(rest(state.config), rest(state.saved))) count += 1;
      if (!same(state.config.challenge?.allowed_categories, state.saved.challenge?.allowed_categories)) count += 1;
      return count;
    }

    // ---- server ---------------------------------------------------------
    function adoptPayload(payload) {
      state.payload = payload;
      state.config = clone(payload.config);
      state.saved = clone(payload.config);
      state.base = clone(payload.base_config);
      state.jsonDirty = false;
    }
    async function loadPayload() {
      try {
        const status = await (await fetch("/status", { cache: "no-store" })).json();
        state.ultimateEnabled = !!status?.features?.ultimate;
      } catch (_) {
        state.ultimateEnabled = false;
      }
      const response = await fetch("/api/card-config", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      adoptPayload(await response.json());
      render();
    }
    async function savePayload() {
      if (state.tab === "json" && state.jsonDirty && !applyJsonText()) return;
      const response = await fetch("/api/card-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config: state.config })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        renderErrors(result.errors || [t("saveFailed")]);
        showToast(t("saveFailed"));
        return;
      }
      adoptPayload(result.payload);
      render();
      showToast(t("saved"));
    }
    async function resetPayload() {
      const response = await fetch("/api/card-config/reset", { method: "POST" });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        renderErrors(result.errors || [t("saveFailed")]);
        return;
      }
      adoptPayload(result.payload);
      state.open.clear();
      render();
      showToast(t("resetDone"));
    }
    function discardChanges() {
      state.config = clone(state.saved);
      state.jsonDirty = false;
      render();
      showToast(t("discarded"));
    }
    function applyJsonText() {
      const area = $("jsonText");
      if (!area) return true;
      try {
        state.config = JSON.parse(area.value);
      } catch (error) {
        showToast(`${t("jsonInvalid")}: ${error.message}`);
        return false;
      }
      state.jsonDirty = false;
      renderChrome();
      showToast(t("jsonApplied"));
      return true;
    }
    function exportJson() {
      const blob = new Blob([JSON.stringify(state.config, null, 2) + "\n"], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "rogue-go-arena-cards.json";
      link.click();
      URL.revokeObjectURL(link.href);
    }

    // ---- rendering ------------------------------------------------------
    function renderChrome() {
      document.documentElement.lang = locale();
      document.title = `rogue-go-arena · ${t("title")}`;
      els.pageTitle.textContent = t("title");
      els.pageSubtitle.textContent = t("subtitle");
      els.langLabel.textContent = t("lang");
      els.langSelect.innerHTML = Object.entries(langLabels).map(([key, label]) =>
        `<option value="${key}"${key === state.lang ? " selected" : ""}>${label}</option>`).join("");
      els.moreBtn.textContent = t("more");
      els.reloadBtn.textContent = t("reload");
      els.exportBtn.textContent = t("export");
      els.resetBtn.textContent = state.resetArmed ? t("resetConfirm") : t("reset");
      els.searchBox.placeholder = t("search");
      els.searchLabel.textContent = t("search");
      els.changedOnlyLabel.textContent = t("changedOnly");

      const unsaved = unsavedCount();
      const pending = !!state.payload?.pending_next_game;
      els.statusChip.className = "status-chip" + (unsaved ? " dirty" : pending ? " pending" : "");
      els.statusChip.textContent = unsaved ? t("statusDirty", { n: unsaved }) : pending ? t("statusPending") : t("statusClean");
      els.saveState.textContent = unsaved ? t("statusDirty", { n: unsaved }) : t("noChanges");
      els.saveNote.textContent = t("nextGameNote");
      els.saveBtn.textContent = t("save");
      els.discardBtn.textContent = t("discard");
      const jsonPending = state.tab === "json" && state.jsonDirty;
      els.saveBtn.disabled = !unsaved && !jsonPending;
      els.discardBtn.disabled = !unsaved && !jsonPending;
      els.pendingNotice.innerHTML = pending && !unsaved ? `<div class="notice">ⓘ <span>${escapeHtml(t("pendingNotice"))}</span></div>` : "";

      const counts = {
        rogue: Object.keys(state.config?.cards?.rogue || {}).length,
        ultimate: Object.keys(state.config?.cards?.ultimate || {}).length,
        tuning: Object.keys(state.config?.tuning || {}).length
      };
      if (state.tab === "ultimate" && !state.ultimateEnabled) state.tab = "rogue";
      els.tabs.innerHTML = ["rogue", ...(state.ultimateEnabled ? ["ultimate"] : []), "tuning"].map(key =>
        `<button type="button" data-tab="${key}" class="${state.tab === key ? "active" : ""}" aria-current="${state.tab === key}">${t(key)}<span class="count">${counts[key]}</span></button>`
      ).join("") + `<span class="spacer"></span><button type="button" data-tab="json" id="advancedJsonBtn" class="${state.tab === "json" ? "active" : ""}">${t("json")}</button>`;

      const filters = state.tab === "rogue" ? ["all", "changed", "off"] : state.tab === "json" ? [] : ["all", "changed"];
      els.toolbar.hidden = state.tab === "json";
      els.filterChips.innerHTML = filters.map(key =>
        `<button type="button" class="chip${state.filter === key ? " active" : ""}" data-filter="${key}" aria-pressed="${state.filter === key}">${t({ all: "filterAll", changed: "filterChanged", off: "filterOff" }[key])}</button>`
      ).join("");
      els.changedOnly.checked = state.filter === "changed";
    }

    function renderErrors(errors = state.payload?.errors || []) {
      els.errorBox.innerHTML = errors.length
        ? `<div class="errorbox">${errors.map(item => `<div>${escapeHtml(item)}</div>`).join("")}</div>`
        : "";
    }

    function matches(values) {
      const query = state.query.trim().toLowerCase();
      return !query || values.join(" ").toLowerCase().includes(query);
    }

    function renderCards(mode) {
      const cards = state.config.cards[mode] || {};
      const meta = state.config.meta?.[mode] || {};
      els.sectionSub.textContent = mode === "rogue" ? t("cardsSub") : t("ultimateSub");
      const rows = Object.entries(cards).filter(([id, card]) => {
        if (state.filter === "changed" && !cardEdited(mode, id)) return false;
        if (state.filter === "off" && (mode !== "rogue" || isOffered(id))) return false;
        return matches([id, textOf(card.name), textOf(card.desc), meta[id]?.tier, meta[id]?.category]);
      });
      if (!rows.length) {
        els.content.innerHTML = `<div class="empty">${t("noMatch")}</div>`;
        return;
      }
      // A narrow search (or an exact card id) opens the matching cards straight away.
      const query = state.query.trim().toLowerCase();
      const autoOpen = id => query !== "" && (rows.length <= 3 || id.toLowerCase() === query);
      els.content.innerHTML = `<div class="card-grid">${rows.map(([id, card]) => cardTile(mode, id, card, autoOpen(id) || state.open.has(`${mode}:${id}`))).join("")}</div>`;
      bindCards(mode);
    }

    function cardTile(mode, id, card, open) {
      const meta = effectiveMeta(mode, id);
      const offered = mode !== "rogue" || isOffered(id);
      const freq = mode === "rogue" ? freqKey(id) : "normal";
      const badges = [
        meta.tier ? `<span class="badge tier">${escapeHtml(meta.tier)}</span>` : "",
        meta.category ? `<span class="badge">${escapeHtml(metaLabel(meta.category))}</span>` : "",
        !offered ? `<span class="badge off">${t("off")}</span>` : "",
        offered && freq === "often" ? `<span class="badge often">${t("oftenBadge")}</span>` : "",
        cardEdited(mode, id) ? `<span class="badge edited">${t("edited")}</span>` : ""
      ].join("");
      return `
        <article class="card-row${open ? " open" : ""}${offered ? "" : " off"}" data-id="${escapeHtml(id)}">
          <div class="card-head">
            <div class="card-icon" aria-hidden="true">${escapeHtml(card.icon || "?")}</div>
            <div class="card-title">
              <strong>${escapeHtml(textOf(card.name) || id)}</strong>
              <span class="mono">${escapeHtml(id)}</span>
            </div>
            <button type="button" class="${open ? "ghost" : ""}" data-toggle aria-expanded="${open}">${open ? t("done") : t("edit")}</button>
          </div>
          <div class="badges">${badges}</div>
          <p class="card-desc">${escapeHtml(textOf(card.desc))}</p>
          ${open ? cardEditor(mode, id, card, state.config.meta?.[mode]?.[id] || {}, meta) : ""}
        </article>`;
    }

    function cardEditor(mode, id, card, meta, effective) {
      const category = state.config.challenge?.categories?.[id] || "";
      const freq = mode === "rogue" ? freqKey(id) : "normal";
      const featuredPool = mode === "rogue" ? "rogue_featured" : "ultimate_featured";
      const sw = (attr, label, checked) =>
        `<label class="switch"><span>${label}</span><input type="checkbox" ${attr} ${checked ? "checked" : ""}></label>`;
      return `
        <div class="editor">
          <div>
            <h3>${t("details")}</h3>
            <div class="fields">
              <div class="field"><label>${t("name")}</label><input data-field="name" value="${escapeHtml(textOf(card.name))}"></div>
              <div class="field"><label>${t("icon")}</label><input data-field="icon" value="${escapeHtml(card.icon || "")}"></div>
              <div class="field wide"><label>${t("desc")}</label><textarea data-field="desc">${escapeHtml(textOf(card.desc))}</textarea></div>
              <div class="field wide"><label>${t("summary")}</label><input data-field="summary" value="${escapeHtml(textOf(card.summary))}"></div>
              <div class="field"><label>${t("uses")}</label><input data-field="uses" type="number" min="0" step="1" value="${numberValue(card.uses)}" placeholder="${escapeHtml(t("usesHint"))}"></div>
              <div class="field"><label>${t("tier")}</label><input data-meta="tier" value="${escapeHtml(meta.tier || "")}" placeholder="${escapeHtml(effective.tier || "")}"></div>
              <div class="field"><label>${t("category")}</label><input data-meta="category" value="${escapeHtml(meta.category || "")}" placeholder="${escapeHtml(effective.category || "")}"></div>
              <div class="field"><label>${t("complexity")}</label><input data-meta="complexity" value="${escapeHtml(meta.complexity || "")}" placeholder="${escapeHtml(effective.complexity || "")}"></div>
            </div>
          </div>
          <div>
            <h3>${t("appears")}</h3>
            <div class="switches">
              ${mode === "rogue" ? `
                ${sw("data-offered", t("offered"), isOffered(id))}
                <div class="freq">
                  <span class="hint">${t("freq")}</span>
                  <div class="segmented" role="group" aria-label="${escapeHtml(t("freq"))}">
                    ${["rare", "normal", "often"].map(key => `<button type="button" data-freq="${key}" class="${freq === key ? "active" : ""}" aria-pressed="${freq === key}" ${isOffered(id) ? "" : "disabled"}>${t(key)}</button>`).join("")}
                    ${freq === "custom" ? `<button type="button" class="active" aria-pressed="true" disabled>${t("custom")} ×${escapeHtml(weightOf(id))}</button>` : ""}
                  </div>
                </div>` : ""}
              ${sw(`data-pool="${featuredPool}"`, t("featured"), poolHas(featuredPool, id))}
              ${mode === "rogue" ? `
                ${sw('data-pool="challenge_beta"', t("challenge"), poolHas("challenge_beta", id))}
                ${sw('data-pool="two_player_rogue"', t("twoPlayer"), poolHas("two_player_rogue", id))}
                ${sw('data-pool="ai_rogue"', t("aiPool"), poolHas("ai_rogue", id))}
                <div class="field"><label>${t("challengeCategory")}</label><select data-challenge-category>
                  <option value="">${t("none")}</option>
                  ${(state.config.challenge?.allowed_categories || []).map(item => `<option value="${escapeHtml(item)}" ${category === item ? "selected" : ""}>${escapeHtml(item)}</option>`).join("")}
                </select></div>` : sw('data-pool="ai_ultimate"', t("aiPool"), poolHas("ai_ultimate", id))}
            </div>
          </div>
        </div>
        <div class="card-actions">
          <button type="button" class="ghost" data-revert ${cardEdited(mode, id) ? "" : "disabled"}>${t("revert")}</button>
        </div>`;
    }

    function bindCards(mode) {
      els.content.querySelectorAll(".card-row").forEach(row => {
        const id = row.dataset.id;
        const key = `${mode}:${id}`;
        const card = state.config.cards[mode][id];
        row.querySelector("[data-toggle]").addEventListener("click", () => {
          if (row.classList.contains("open")) state.open.delete(key); else state.open.add(key);
          renderCards(mode);
        });
        row.querySelectorAll("[data-field]").forEach(input => {
          input.addEventListener("input", () => {
            const field = input.dataset.field;
            if (field === "summary") {
              if (!card.summary || typeof card.summary !== "object") card.summary = {};
              if (input.value.trim()) card.summary[locale()] = input.value;
              else delete card.summary[locale()];
              if (!Object.keys(card.summary).length) delete card.summary;
            } else if (field === "name" || field === "desc") {
              if (!card[field] || typeof card[field] !== "object") card[field] = {};
              card[field][locale()] = input.value;
              if (field === "name") row.querySelector(".card-title strong").textContent = input.value || id;
            } else if (field === "uses") {
              if (input.value === "") delete card.uses;
              else card.uses = Math.max(0, Math.round(Number(input.value) || 0));
            } else {
              card[field] = input.value;
              row.querySelector(".card-icon").textContent = input.value || "?";
            }
            renderChrome();
          });
        });
        row.querySelectorAll("[data-meta]").forEach(input => {
          input.addEventListener("input", () => {
            state.config.meta ||= {};
            state.config.meta[mode] ||= {};
            const meta = state.config.meta[mode][id] || (state.config.meta[mode][id] = {});
            meta[input.dataset.meta] = input.value;
            renderChrome();
          });
        });
        row.querySelector("[data-offered]")?.addEventListener("change", event => {
          setOffered(id, event.target.checked);
          state.open.add(key);
          rerender();
        });
        row.querySelectorAll("[data-freq]").forEach(btn => {
          btn.addEventListener("click", () => {
            setWeight(id, FREQ[btn.dataset.freq]);
            state.open.add(key);
            rerender();
          });
        });
        row.querySelectorAll("[data-pool]").forEach(input => {
          input.addEventListener("change", () => {
            setPool(input.dataset.pool, id, input.checked);
            state.open.add(key);
            rerender();
          });
        });
        row.querySelector("[data-challenge-category]")?.addEventListener("change", event => {
          state.config.challenge.categories ||= {};
          if (event.target.value) state.config.challenge.categories[id] = event.target.value;
          else delete state.config.challenge.categories[id];
          state.open.add(key);
          rerender();
        });
        row.querySelector("[data-revert]")?.addEventListener("click", () => revertCard(mode, id));
      });
    }

    function revertCard(mode, id) {
      const base = cardSnapshot(state.base, mode, id);
      if (!base) return;
      state.config.cards[mode][id] = clone(base.card);
      state.config.meta ||= {};
      state.config.meta[mode] ||= {};
      if (base.meta) state.config.meta[mode][id] = clone(base.meta); else delete state.config.meta[mode][id];
      for (const [pool, on] of Object.entries(base.pools)) setPool(pool, id, on);
      if (mode === "rogue") {
        state.config.challenge.categories ||= {};
        if (base.category) state.config.challenge.categories[id] = base.category; else delete state.config.challenge.categories[id];
        setOffered(id, !base.disabled);
        setWeight(id, Number(base.weight));
      }
      rerender();
    }

    function tuningGroups(entries) {
      const groups = new Map();
      for (const entry of entries) {
        const spec = entry[1];
        const cardName = spec.card ? textOf(state.config.cards?.rogue?.[spec.card]?.name || state.config.cards?.ultimate?.[spec.card]?.name) : "";
        const groupKey = spec.card ? `${spec.group || ""}:${spec.card}` : `${spec.group || ""}:`;
        const icon = state.config.cards?.rogue?.[spec.card]?.icon || state.config.cards?.ultimate?.[spec.card]?.icon || "⚙";
        const label = spec.card ? `${spec.group ? spec.group + " · " : ""}${cardName || spec.card}` : (spec.group || t("general"));
        if (!groups.has(groupKey)) groups.set(groupKey, { label, icon, entries: [] });
        groups.get(groupKey).entries.push(entry);
      }
      return [...groups.values()];
    }

    function renderTuning() {
      els.sectionSub.textContent = t("tuningSub");
      const entries = Object.entries(state.config.tuning || {}).filter(([key, spec]) => {
        if (state.filter === "changed" && !tuneEdited(key)) return false;
        return matches([key, textOf(spec.label), spec.group, spec.card, textOf(state.config.cards?.rogue?.[spec.card]?.name)]);
      });
      if (!entries.length) {
        els.content.innerHTML = `<div class="empty">${t("noMatch")}</div>`;
        return;
      }
      els.content.innerHTML = tuningGroups(entries).map(group => `
        <section class="tune-group">
          <h2><span aria-hidden="true">${escapeHtml(group.icon)}</span>${escapeHtml(group.label)}</h2>
          <div class="tune-list">${group.entries.map(([key, spec]) => tuneRow(key, spec)).join("")}</div>
        </section>`).join("");
      bindTuning();
    }

    function isChance(spec) { return Number(spec.min) >= 0 && Number(spec.max) === 1 && Number(spec.step ?? 1) < 1; }

    function tuneRow(key, spec) {
      const value = Number(spec.value);
      const base = state.base?.tuning?.[key];
      return `
        <article class="tune-row${tuneEdited(key) ? " edited" : ""}" data-key="${escapeHtml(key)}">
          <div class="tune-label">
            <strong>${escapeHtml(textOf(spec.label) || key)}</strong>
            <span class="mono">${escapeHtml(key)}</span>
          </div>
          <div class="tune-control">
            <input data-tune="value" type="range" aria-label="${escapeHtml(textOf(spec.label) || key)}" min="${numberValue(spec.min)}" max="${numberValue(spec.max)}" step="${numberValue(spec.step)}" value="${numberValue(value)}">
            <input data-tune-number type="number" aria-label="${escapeHtml(textOf(spec.label) || key)}" min="${numberValue(spec.min)}" max="${numberValue(spec.max)}" step="${numberValue(spec.step)}" value="${escapeHtml(formatNumber(value, spec.step))}">
          </div>
          <button type="button" class="ghost" data-reset-tune ${tuneEdited(key) ? "" : "disabled"}>${t("resetValue")}</button>
          <div class="tune-meta">
            ${isChance(spec) ? `<span class="pct" data-pct>${Math.round(value * 1000) / 10}%</span>` : ""}
            ${base ? `<span>${t("defaultValue")}: ${escapeHtml(formatNumber(base.value, base.step))}</span>` : ""}
            <span>${t("min")} ${escapeHtml(formatNumber(spec.min, spec.step))} – ${t("max")} ${escapeHtml(formatNumber(spec.max, spec.step))}</span>
          </div>
          <details class="advanced">
            <summary>${t("advanced")}</summary>
            <div class="fields">
              <div class="field"><label>${t("min")}</label><input data-tune="min" type="number" step="any" value="${numberValue(spec.min)}"></div>
              <div class="field"><label>${t("max")}</label><input data-tune="max" type="number" step="any" value="${numberValue(spec.max)}"></div>
              <div class="field"><label>${t("step")}</label><input data-tune="step" type="number" step="any" value="${numberValue(spec.step ?? 1)}"></div>
              <div class="field"><label>${t("group")}</label><input data-tune="group" value="${escapeHtml(spec.group || "")}"></div>
            </div>
          </details>
        </article>`;
    }

    function bindTuning() {
      els.content.querySelectorAll(".tune-row").forEach(row => {
        const key = row.dataset.key;
        const spec = state.config.tuning[key];
        const range = row.querySelector('[data-tune="value"]');
        const number = row.querySelector("[data-tune-number]");
        const pct = row.querySelector("[data-pct]");
        const reflect = () => {
          row.classList.toggle("edited", tuneEdited(key));
          row.querySelector("[data-reset-tune]").disabled = !tuneEdited(key);
          if (pct) pct.textContent = `${Math.round(Number(spec.value) * 1000) / 10}%`;
          renderChrome();
        };
        row.querySelectorAll("[data-tune]").forEach(input => {
          input.addEventListener("input", () => {
            const field = input.dataset.tune;
            if (field === "group") spec.group = input.value;
            else spec[field] = input.value === "" && field !== "value" ? null : Number(input.value);
            if (field === "value") number.value = formatNumber(spec.value, spec.step);
            reflect();
          });
        });
        number.addEventListener("input", () => {
          spec.value = Number(number.value);
          range.value = String(spec.value);
          reflect();
        });
        row.querySelector("[data-reset-tune]").addEventListener("click", () => {
          state.config.tuning[key] = clone(state.base.tuning[key]);
          renderTuning();
          renderChrome();
        });
      });
    }

    function renderJson() {
      els.sectionSub.textContent = t("jsonSub");
      els.content.innerHTML = `
        <div class="json-panel">
          <textarea id="jsonText" spellcheck="false" aria-label="JSON">${escapeHtml(JSON.stringify(state.config, null, 2))}</textarea>
          <div><button type="button" id="applyJsonBtn">${t("applyJson")}</button></div>
        </div>`;
      $("jsonText").addEventListener("input", () => { state.jsonDirty = true; renderChrome(); });
      $("applyJsonBtn").addEventListener("click", applyJsonText);
    }

    function renderContent() {
      if (!state.config) return;
      if (state.tab === "rogue" || state.tab === "ultimate") renderCards(state.tab);
      else if (state.tab === "tuning") renderTuning();
      else renderJson();
    }
    function rerender() { renderChrome(); renderContent(); }
    function render() { renderChrome(); renderErrors(); renderContent(); }

    // ---- events ---------------------------------------------------------
    els.tabs.addEventListener("click", event => {
      const btn = event.target.closest("[data-tab]");
      if (!btn) return;
      if (state.tab === "json" && state.jsonDirty && btn.dataset.tab !== "json" && !applyJsonText()) return;
      state.tab = btn.dataset.tab;
      state.filter = "all";
      render();
    });
    els.filterChips.addEventListener("click", event => {
      const btn = event.target.closest("[data-filter]");
      if (!btn) return;
      state.filter = btn.dataset.filter;
      rerender();
    });
    els.changedOnly.addEventListener("change", event => {
      state.filter = event.target.checked ? "changed" : "all";
      rerender();
    });
    els.searchBox.addEventListener("input", event => {
      state.query = event.target.value;
      renderContent();
    });
    els.langSelect.addEventListener("change", async () => {
      state.lang = els.langSelect.value;
      writeStorage("card_editor_lang", state.lang);
      await loadMetaLabels(state.lang);
      render();
    });
    els.moreBtn.addEventListener("click", () => {
      const open = els.morePanel.hidden;
      els.morePanel.hidden = !open;
      els.moreBtn.setAttribute("aria-expanded", String(open));
      if (!open) { state.resetArmed = false; renderChrome(); }
    });
    document.addEventListener("click", event => {
      if (!event.target.closest(".menu") && !els.morePanel.hidden) {
        els.morePanel.hidden = true;
        els.moreBtn.setAttribute("aria-expanded", "false");
        state.resetArmed = false;
        renderChrome();
      }
    });
    els.reloadBtn.addEventListener("click", () => {
      els.morePanel.hidden = true;
      loadPayload().catch(error => showToast(`${t("loadFailed")}: ${error.message}`));
    });
    els.exportBtn.addEventListener("click", () => { els.morePanel.hidden = true; exportJson(); });
    els.resetBtn.addEventListener("click", () => {
      if (!state.resetArmed) { state.resetArmed = true; renderChrome(); return; }
      state.resetArmed = false;
      els.morePanel.hidden = true;
      resetPayload().catch(error => showToast(error.message));
    });
    els.saveBtn.addEventListener("click", () => savePayload().catch(error => showToast(`${t("saveFailed")}: ${error.message}`)));
    els.discardBtn.addEventListener("click", discardChanges);
    window.addEventListener("beforeunload", event => {
      if (unsavedCount() > 0) { event.preventDefault(); event.returnValue = ""; }
    });

    loadMetaLabels(state.lang)
      .then(loadPayload)
      .catch(error => showToast(`${t("loadFailed")}: ${error.message}`));
  </script>
</body>
</html>
